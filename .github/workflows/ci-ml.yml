name: ci-ml

on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - "configs/**"
      - ".github/workflows/ci-ml.yml"
  pull_request:
    paths:
      - "ml/**"
      - "configs/**"
      - ".github/workflows/ci-ml.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q